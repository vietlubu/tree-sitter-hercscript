[package]
name = "tree-sitter-hercscript"
description = "Hercules Script grammar for the tree-sitter parsing library"
version = "0.3.0"
keywords = ["incremental", "parsing", "hercscript", "hercules"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/vietlubu/tree-sitter-hercscript"
edition = "2021"
license = "MIT"

[lib]
path = "bindings/rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tree-sitter = "~0.20"

[build-dependencies]
cc = "1.0"
